{% extends "base.html" %}
{% block title %}Смена пароля · TeamBook{% endblock %}
{% block content %}
<div class="card" style="max-width:420px">
  <h2>Смена пароля</h2>
  <form method="post">
    <div class="form-grid">
      <div class="full">
        <label>Текущий пароль</label>
        <input type="password" name="old" required>
      </div>
      <div class="full">
        <label>Новый пароль (мин. 6 символов)</label>
        <input type="password" name="new" required>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn primary" type="submit">Сменить</button>
      <a class="btn" href="{{ url_for('index') }}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
