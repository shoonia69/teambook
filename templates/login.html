{% extends "base.html" %}
{% block title %}Вход · TeamBook{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1>TeamBook</h1>
    <p class="sub">Блокнот руководителя. Войдите с вашим логином и паролем.</p>
    <form method="post">
      <input type="text" name="username" placeholder="Логин" autofocus required>
      <input type="password" name="password" placeholder="Пароль" required>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn primary" type="submit" style="width:100%">Войти</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
