name: TeamBook CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies and quality tools
        run: |
          pip install --require-hashes -r requirements.lock
          pip install pytest==9.1.1 ruff==0.14.1 pip-audit==2.9.0
      - name: Verify dependency lock
        run: |
          pip install uv==0.12.18
          uv pip compile requirements.txt --python-version 3.12 --python-platform linux --no-annotate --no-header --generate-hashes -o requirements.generated.lock
          diff -u requirements.lock requirements.generated.lock
      - name: Lint Python correctness
        run: python -m ruff check --select E9,F app.py bot.py bot_worker.py restore_offline.py wsgi.py
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.lock
      - name: Compile
        run: python -m py_compile app.py bot.py bot_worker.py restore_offline.py wsgi.py
      - name: Pytest migration suite
        run: python -m pytest -q
